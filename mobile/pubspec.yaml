name: flota_obd
description: App del chofer - lee el escáner OBD2 ELM327 y el GPS del celular y los envía a la plataforma.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  # Bluetooth clásico (SPP), que es lo que usan los ELM327 chinos "v1.5 / v2.1".
  flutter_blue_classic: ^0.0.5
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
